<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpresoFast | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="login-brand">
        <span class="brand-mark">EF</span
        ><span
          ><strong>ExpresoFast</strong
          ><small>Centro de control logístico</small></span
        >
      </div>
      <section class="login-panel">
        <p class="eyebrow">Acceso seguro</p>
        <h1>Iniciar sesión</h1>
        <p>Ingresa a tu espacio operativo.</p>
        <form id="login-form">
          <label
            >Usuario<input name="username" autocomplete="username" required
          /></label>
          <label
            >Contraseña<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="primary-button" type="submit">Entrar</button>
        </form>
        <p class="login-feedback" id="login-feedback" role="alert"></p>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
