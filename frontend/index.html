<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicio de sesión de la consola de operación logística ExpresoFast" />
  <title>ExpresoFast | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>

<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand brand-center" aria-hidden="true">
        <span class="brand-mark">EF</span>
        <span>
          <strong>ExpresoFast</strong>
          <small>Centro de control logístico</small>
        </span>
      </div>

      <h1 id="login-title">Iniciar sesión</h1>
      <p class="login-copy">
        Ingresa tus credenciales para acceder a la consola de operaciones.
      </p>

      <div class="form-error" id="login-error" role="alert" aria-live="polite" hidden></div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="usuario.operador"
            required />
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
            required />
        </div>

        <button class="primary-button" type="submit" id="login-button">
          Ingresar
        </button>
      </form>
    </section>
  </main>

  <footer class="footer login-footer">
    <span>ExpresoFast</span>
    <span>Plataforma de logística y monitoreo</span>
  </footer>
</body>

</html>
